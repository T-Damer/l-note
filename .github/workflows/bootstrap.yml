name: Bootstrap implementation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

concurrency:
  group: l-note-bootstrap
  cancel-in-progress: false

jobs:
  expand-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/offline-knowledge-packs
          fetch-depth: 0

      - name: Expand source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* | base64 --decode > /tmp/l-note.tar.gz
          echo "b9b6c9d7163b8bb500749fdefba27ccd77dc8411d14241c075bddf33b35e2cb0  /tmp/l-note.tar.gz" | sha256sum --check --strict
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/l-note.tar.gz -C .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build custom pack fixture
        run: npm run pack:build -- examples/custom-pack.source.json /tmp/custom-pack.json

      - name: Build web application
        run: npm run build

      - name: Commit normal source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build offline knowledge pack MVP"
          git push origin HEAD:agent/offline-knowledge-packs
