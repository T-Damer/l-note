name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check

  duckdb-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install pinned DuckDB CLI 1.4.5 LTS
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/duckdb_cli-linux-amd64.zip"
          target="$RUNNER_TEMP/duckdb-cli"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/duckdb/duckdb/releases/download/v1.4.5/duckdb_cli-linux-amd64.zip
          echo "ff4ef9ec59fe3e1a1f3dd1004c6218d1fd59c0533c185c968c4403fd0240d02b  $archive" \
            | sha256sum --check --strict
          mkdir -p "$target"
          unzip -q "$archive" -d "$target"
          chmod +x "$target/duckdb"
          echo "DUCKDB_BIN=$target/duckdb" >> "$GITHUB_ENV"
      - run: npm run test:duckdb-e2e
