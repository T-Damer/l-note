name: CI

on:
  push:
    branches:
      - main
      - agent/offline-knowledge-packs
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: l-note-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build custom pack fixture
        run: npm run pack:build -- examples/custom-pack.source.json /tmp/custom-pack.json

      - name: Build production PWA
        run: npm run build
