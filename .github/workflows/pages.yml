name: Deploy L-Note to GitHub Pages

on:
  push:
    branches:
      - main
      - agent/universal-offline-kb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: ${{ always() && github.ref_name == 'agent/universal-offline-kb' }}
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Report Pages result on the canonical PR
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            const marker = '<!-- l-note-pages-preview -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              state: 'open',
            });
            if (!prs.length) return;

            const issue_number = prs[0].number;
            const buildResult = process.env.BUILD_RESULT || 'unknown';
            const deployResult = process.env.DEPLOY_RESULT || 'unknown';
            const pageUrl = process.env.PAGE_URL || '';
            const outcome = buildResult === 'success' && deployResult === 'success'
              ? `Hosted preview: ${pageUrl}`
              : 'Pages did not publish. Open the workflow run for the failing stage.';
            const body = [
              marker,
              '## Hosted preview',
              '',
              `Commit: \`${context.sha.slice(0, 12)}\``,
              `Build: **${buildResult}**`,
              `Deploy: **${deployResult}**`,
              '',
              outcome,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
