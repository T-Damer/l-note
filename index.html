<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f0e8"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>L-Note</title></head><body><header><div><strong>L-Note</strong><span>офлайн-база знаний</span></div><button id="installApp" hidden>Установить</button></header><main><section class="hero"><h1>Ищите знания, а не файлы</h1><p>Устанавливаемые пакеты, нечёткий поиск, связанные понятия, источники и личные наблюдения.</p><div class="search"><input id="query" placeholder="Например: цефтриаксон дозировка" autocomplete="off"><button id="searchButton">Найти</button></div><div id="suggestion" class="suggestion"></div></section><nav><button data-tab="search" class="active">Поиск</button><button data-tab="packs">Пакеты</button><button data-tab="notes">Заметки</button></nav><section id="search" class="tab active"><div id="answer"></div><div id="results"></div></section><section id="packs" class="tab"><h2>Пакеты знаний</h2><p class="muted">Пакет скачивается один раз и после этого работает без сети.</p><div id="packList"></div></section><section id="notes" class="tab"><h2>Личные заметки</h2><form id="noteForm"><input id="noteTitle" placeholder="Заголовок" required><textarea id="noteText" placeholder="Наблюдение, уточнение или собственное правило" required></textarea><input id="noteLinks" placeholder="Связанные понятия через запятую"><button>Сохранить локально</button></form><div id="noteList"></div></section></main><dialog id="reader"><button id="closeReader" class="close">Закрыть</button><article id="readerContent"></article></dialog><script type="module" src="app.js"></script></body></html>
